<style>

@media(max-width:800px){body{grid-template-columns:1fr;height:auto}aside,section,main{max-height:50vh}}

      return;
    }
    if (director.locked && /^(KeyJ|KeyK|Digit\d)$/.test(ev.code)) return;
    if (ev.code === 'KeyL' && !ev.repeat && player && player.fighter && !player.air && !director.locked) { combat.dodge(player.fighter, player.heading(keys, renderer.cam.yaw)); ev.preventDefault(); return; }
    if (ev.code === 'Space' && !ev.repeat && player && !director.locked) { if (player.jump()) ev.preventDefault(); return; }
    if ((ev.code === 'KeyJ' || ev.code === 'KeyK') && !ev.repeat && player && player.fighter && !player.air) { combat.input(player.fighter, ev.code); ev.preventDefault(); return; }
    if (/^Digit[1-4]$/.test(ev.code) && !ev.repeat && player && player.fighter) { combat.power(player.fighter, +ev.code.slice(5)); ev.preventDefault(); return; }
    if (/^F[1-4]$/.test(ev.code) && combat) { const hs = combat.fighters.filter(f => f.team === 'hero'); switchTo(hs[+ev.code[1] - 1]); ev.preventDefault(); return; }
    if (ev.code === 'Tab' && !ev.repeat && player && combat) {                      // troca de herói controlado
      ev.preventDefault(); const hs = combat.fighters.filter(f => f.team === 'hero' && f.alive); if (hs.length < 2) return;
      switchTo(hs[(hs.indexOf(player.fighter) + 1) % hs.length]); return;
    }
    if (!CTRL.has(ev.code)) return; keys.add(ev.code); ev.preventDefault();
  };
  const ku = ev => keys.delete(ev.code);
  window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);
  $('#ctl').insertAdjacentHTML('beforeend', ' <small>WASD move · Shift anda · J ataque (combo) · K pesado · 1-4 poderes · Tab/F1-F4/clique troca herói · arrastar = câmera</small>');
  $('#run').onclick = async () => { n = await sim.run(); running = true; };
  const bars = $('#bars'), bd = [];
  const updateBars = c => {
    c.fighters.forEach((f, i) => {
      let d = bd[i]; if (!d) { d = bd[i] = document.createElement('div'); d.className = 'hp'; d.innerHTML = '<i></i>'; bars.append(d); }
      const p = f.alive && f.ent.enabled && f.ent.alive ? renderer.project([f.ent.pos[0], f.ent.pos[1], f.ent.pos[2] + 85]) : null;
      d.style.display = p ? 'block' : 'none'; if (!p) return;
      d.style.left = p[0] + 'px'; d.style.top = p[1] + 'px'; const k = Math.max(0, f.hp / f.maxhp);
      const i2 = d.firstChild; i2.style.width = (k * 100) + '%'; i2.style.background = f.team === 'hero' ? '#3c6' : '#e33';
    });
  };
  const loop = now => {                                      // laço único: atores + scripts + desenho
    if (tok !== simTok || my !== seq) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (sim.fx) sim.fx.update(dt);
    const ctl = director.update(dt), locked = director.locked || !!conv;           // ctl: o diretor comanda a câmera
    ui.frame(director); $('#team').style.display = $('#bars').style.display = director.hudHidden ? 'none' : '';
    if (conv) { convT += dt; if (!conv.choices.length && convT > conv.readTime) advance(0); }
    if (actors) {
      actors.settle(ground); actors.update(dt);
      if (!player) {
        const inst = actors.list.find(a => a.ent === sim.host.heroes[0]), fi = combat && combat.fighters.find(f => f.ent === sim.host.heroes[0]);
        if (inst && fi) { player = new Player(inst.ent, inst, actors, ground); player.fighter = fi; fi.controlled = true; Object.assign(renderer.cam, { dist: 700, want: 700, pitch: 1.0, fov: 0.8 }); }
      }
      if (loot) loot.update(dt);
      saveT += dt; if (saveT > 10) { saveT = 0; doSave(); }                    // autosave a cada 10 s
      if (combat) { combat.update(dt); updateBars(combat); teamHud.update(combat.fighters.filter(f => f.team === 'hero'), player && player.fighter); }
      for (let i = fx.length - 1; i >= 0; i--) {              // anima os anéis de poder
        const x = fx[i]; x.ent.fxT += dt; const k = Math.min(1, x.ent.fxT / 0.45), R = x.ent.fxR * k;
        x.base[0] = R * 2; x.base[5] = R * 2; x.base[10] = 6; x.ent._ver++;
        if (k >= 1) { x.ent.alive = false; fx.splice(i, 1); }
      }
      if (player) {
        player.update(dt, locked ? EMPTY : keys, renderer.cam.yaw);
        if (!ctl && follow && player.grounded) {
          const cam = renderer.cam, sh = director.shakeOffset(dt); cam.target = [player.ent.pos[0] + sh[0], player.ent.pos[1] + sh[1], player.ent.pos[2] + 45 + sh[2]];
          cam.want ??= cam.dist; cam.dist = cameraDistance(ground, cam.target, cam.yaw, cam.pitch, cam.want, cam.want * 0.6);
          if (cam.dist < cam.want * 0.65 && cam.pitch < 1.3) cam.pitch = Math.min(1.3, cam.pitch + 0.9 * dt);      // bloqueada: sobe a câmera
        }
      }
    }
    let active = 0; if (running) active = sim.tick(dt);
    const pf = player && player.fighter; $('#simt').textContent = `${pf ? `${pf.ent.name.replace(/_/g, '')} HP ${pf.hp}/${pf.maxhp} · EN ${Math.round(pf.energy)} · abates ${combat.kills} · ` : ''}${actors ? actors.list.length + ' atores · ' : ''}${running ? `t=${sim.runner.t.toFixed(1)}s · ${active}/${n} scripts · ${sim.host.log.length} chamadas` : ''}`;
    renderer.draw(); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// ---- animação: heróis (0301 = herói 03, traje 01) usam as animações dos arquivos "03_*.igb" ----
let animTok = 0;
function stopAnim() { simTok++; animTok++; $('#anim').style.display = 'none'; }
async function setupAnimation(g, e, my) {
  const sk = g.byName('igSkeleton')[0], sel = $('#anim');
  if (!sk || cur.name !== 'actors' || !renderer.items.some(d => d.geo.wt)) return;
  const m = /^(\d{2,3})\d{2}\.igb$/.exec(e.name); if (!m) return;
  const skel = readSkeleton(g, sk), pose = new Pose(skel), list = [];
  for (const f of cur.entries.filter(x => x.name.startsWith(m[1] + '_') && x.name.endsWith('.igb'))) {
    try { const ag = new IGB(await cur.read(f)); for (const a of readAnimations(ag)) if (a.name !== 'afakeanim') list.push({ file: f.name.replace('.igb', ''), a }); } catch (err) { console.warn(f.name, err.message); }
    if (my !== seq) return;
  }
  if (!list.length) return;
  sel.innerHTML = list.map((x, i) => `<option value="${i}">${x.file} · ${x.a.name} (${x.a.dur.toFixed(2)}s)</option>`).join(''); sel.style.display = 'block';
  const tok = ++animTok; let t0 = performance.now();
  const play = i => { pose.setAnimation(list[i].a); t0 = performance.now(); };
  sel.onchange = () => play(+sel.value);
  const idle = list.findIndex(x => x.a.name === 'idle'); sel.value = idle >= 0 ? idle : 0; play(+sel.value);
  const tick = now => { if (tok !== animTok) return; renderer.palette = pose.update((now - t0) / 1000); renderer.draw(); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function mode(m) { if (m !== 'gl') stopAnim(); $('#stage').style.display = m === 'gl' ? 'block' : 'none'; $('#img').style.display = m === 'img' ? 'block' : 'none'; $('#view').style.display = m === 'txt' ? 'block' : 'none'; }

async function show(e, row) {
  const my = ++seq;
  document.querySelectorAll('.row.on').forEach(x => x.classList.remove('on')); row.classList.add('on');
  const t0 = performance.now(), data = await cur.read(e), t1 = performance.now();
  if (my !== seq) return;
  const head = `${cur.name}/${e.name} — ${fmt(e.size)} (comprimido ${fmt(e.compSize)}), lido em ${(t1 - t0).toFixed(0)} ms`;
  $('#info').textContent = head;
  if (e.name.endsWith('.igb')) {
    try {
      const g = new IGB(data), t2 = performance.now();
      const imgs = g.objects.filter(o => o.name === 'igImage');
      const scene = buildScene(g);
      if (scene.draws.length) {
        mode('gl'); renderer ||= new Renderer($('#gl'));
        renderer.onstats = s => { $('#hud').textContent = `draws ${s.draws} (cull ${s.culled}) · tris ${s.tris|0} · texturas na GPU ${s.tex} · VRAM ${fmt(s.vram)}`; };
        renderer.palette = null; stopAnim(); renderer.setScene(scene);
        setupAnimation(g, e, my);
        if (cur.name === 'maps') loadEntities(e, my);
        $('#info').textContent = head + ` · parse ${(t2 - t1).toFixed(0)} ms, cena ${(performance.now() - t2).toFixed(0)} ms`;
        return;
      }
      if (imgs.length) {                       // textura solta: mostra a mip principal
        const im = readImage(g, imgs[0]); mode('img'); const c = $('#img'); c.width = im.w; c.height = im.h;
        const px = decodeDXT(im.data, im.w, im.h, im.fmt), id = new ImageData(new Uint8ClampedArray(px.buffer), im.w, im.h);
        const ctx = c.getContext('2d'); ctx.putImageData(id, 0, 0); ctx.save(); ctx.globalCompositeOperation = 'copy'; ctx.scale(1, -1); ctx.drawImage(c, 0, -im.h); ctx.restore();
        $('#info').textContent = head + ` · ${im.w}×${im.h} ${im.fmt.toUpperCase()}`;
        return;
      }
      mode('txt'); $('#view').textContent = g.objects.map(o => o.name).join('\n'); return;
    } catch (err) { mode('txt'); $('#view').textContent = 'IGB: ' + err.message + '\n\n' + hex(data); return; }
  }
  mode('txt');
  let out;
  if (e.name.endsWith('.xmlb')) { try { out = toXml(parseXmlb(data)); } catch { out = hex(data); } }
  else if (/\.(py|txt|engb|navb)$/.test(e.name)) {
    out = new TextDecoder('latin1').decode(data.subarray(0, 200000));
    if (e.name.endsWith('.py')) out += '\n\n──────── execução simulada (relógio virtual; sinais disparados automaticamente) ────────\n' + traceScript(out);
  }
  else out = hex(data);
  $('#view').textContent = out;
}
function traceScript(src) {
  try {
    const host = new Host(() => 0.5), r = new Runner(host); r.start(parseScript(src), { owner: 'script' });
    for (let i = 0; i < 400 && r.tasks.some(k => !k.done); i++) { r.advance(0.5); for (const k of r.blocked) r.signal(k.sig); }
    const f = a => typeof a === 'string' ? JSON.stringify(a) : a;
    return host.log.map(l => `[t=${l.t.toFixed(2).padStart(6)}s] ${l.fn}(${l.args.map(f).join(', ')})`).join('\n') || '(sem chamadas ao mundo)';
  } catch (err) { return 'erro: ' + err.message; }
}
function hex(d) { let s = ''; const n = Math.min(d.length, 4096);
  for (let i = 0; i < n; i += 16) { const r = d.subarray(i, i + 16);
    s += i.toString(16).padStart(6, '0') + '  ' + [...r].map(b => b.toString(16).padStart(2, '0')).join(' ').padEnd(48) + ' ' + [...r].map(b => b >= 32 && b < 127 ? String.fromCharCode(b) : '.').join('') + '\n'; }
  return s + (d.length > n ? `\n… +${d.length - n} bytes` : ''); }

$('#q').oninput = () => cur && render();
$('#pick').onclick = async () => {
  if (window.showDirectoryPicker) {
    const dir = await showDirectoryPicker({ mode: 'read' }), m = new Map(); GAMEFS = new HandleFS(dir);
    for await (const [n, h] of dir.entries()) if (h.kind === 'file' && n.endsWith('.bin')) m.set(n.slice(0, -4), await h.getFile());
    await load(m);
  } else $('#fallback').click();
};
$('#fallback').onchange = async e => { const m = new Map(); GAMEFS = new FileListFS(e.target.files); for (const f of e.target.files) if (f.name.endsWith('.bin')) m.set(f.name.slice(0, -4), f); await load(m); };
// modo remoto (desenvolvimento / hospedagem própria): ?remote=http://host/ -> lê os .bin por HTTP Range
const remote = new URLSearchParams(location.search).get('remote');
if (remote) GAMEFS = new HttpFS(remote);
if (remote) load(new Map(BINS.map(n => [n, new RemoteBlob(remote.replace(/\/?$/, '/') + n + '.bin')]))).then(() => { if (!new URLSearchParams(location.search).has('nomenu')) showTitle(); });
window.__mua = { archives, show: async (arc, name) => { cur = archives.get(arc); render(); const e = cur.byName.get(name); await show(e, document.createElement('div')); }, get renderer() { return renderer; } };
